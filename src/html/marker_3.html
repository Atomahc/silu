<p style="font-size: 0.16rem; font-family: 宋体; margin-bottom: 10px; line-height: 1.6; color: #333;">2013年，国家主席习近平提出了“一带一路”倡议。作为“一带一路”的重要支点，霍尔果斯的发展势头愈发迅猛。</p>
<p style="font-size: 0.16rem; font-family: 宋体; margin-bottom: 10px; line-height: 1.6; color: #333;">2016年，霍尔果斯口岸开行中欧班列，将中国制造带向世界。自开行以来，经霍尔果斯口岸出入境中欧班列从2016年600余列次上涨到2020年的4727列，2020年过货量662万吨。</p>
